# ============================================================
# 排砖宝 · Nginx 反向代理配置 (腾讯云 CVM)
# ============================================================
# 部署路径: /etc/nginx/nginx.conf
# 验证: nginx -t && nginx -s reload
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=16k;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml+rss image/svg+xml;

    # 频率限制 (API)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ==================== HTTPS 服务 ====================
    server {
        listen 443 ssl http2;
        server_name api.paizhuanbao.com app.paizhuanbao.com;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ========== API 代理 ==========
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
        }

        # ========== 健康检查 ==========
        location /health {
            proxy_pass http://backend:8000/health;
            access_log off;
        }

        # ========== API 文档 ==========
        location /api/docs {
            proxy_pass http://backend:8000/api/docs;
        }
        location /api/openapi.json {
            proxy_pass http://backend:8000/api/openapi.json;
        }

        # ========== 上传文件 ==========
        location /uploads/ {
            proxy_pass http://backend:8000/uploads/;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # ========== 静态前端 (从后端 static 或独立目录) ==========
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
        }
    }

    # ==================== HTTP → HTTPS 跳转 ====================
    server {
        listen 80;
        server_name api.paizhuanbao.com app.paizhuanbao.com;
        return 301 https://$host$request_uri;
    }
}
